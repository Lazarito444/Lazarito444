<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="84" viewBox="0 0 1200 84" role="img" aria-label="thanks for stopping by">
  <style>
    text { font-family: ui-monospace, 'Cascadia Code', Consolas, 'JetBrains Mono', Menlo, monospace; }
    @keyframes blink { 0%, 55% { opacity: 1; } 60%, 100% { opacity: 0; } }
    .cur { animation: blink 1.1s steps(1, end) infinite; }
  </style>
  <rect x="40" y="0" width="1120" height="84" rx="14" fill="#0d1117" stroke="#30363d" stroke-width="2"/>
  <!-- shell pill -->
  <rect x="74" y="22" width="192" height="40" rx="20" fill="#0f2e1d" stroke="#1f6f3f"/>
  <text x="94" y="48" font-size="15" fill="#7ee787">● powershell 7</text>
  <!-- message -->
  <text x="600" y="49" text-anchor="middle" font-size="17" fill="#8b949e">— thanks for stopping by —</text>
  <!-- exit pill -->
  <rect x="934" y="22" width="192" height="40" rx="20" fill="none" stroke="#f97316" opacity="0.85"/>
  <text x="954" y="48" font-size="15"><tspan fill="#f97316" class="cur">▍</tspan><tspan dx="8" fill="#fcbf98">exit 0</tspan></text>
</svg>
