# Drop this in the Lazarito444/Lazarito444 repo as: .github/workflows/generate-snake.yml
# Then Actions tab → "generate snake" → Run workflow once. It refreshes every 12 hours.
name: generate snake
on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Generate snake SVG
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: Lazarito444
          outputs: |
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#5636c8&color_dots=#0d1117,#1e2d3b,#234059,#2e5a75,#79c0ff

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
